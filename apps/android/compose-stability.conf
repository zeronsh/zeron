// Types the Compose compiler should treat as stable (compared with equals()).
//
// UniFFI generates Rust records as Kotlin data classes with `var` fields, so
// the compiler assumes they may change behind its back and re-runs every row
// whenever a new workspace snapshot arrives. The app never mutates them:
// each snapshot is a fresh, read-only copy. Marking them stable lets rows
// whose data did not change skip recomposition.
uniffi.zeron_core.*
kotlin.collections.List
