// Types Compose may treat as stable (compared with equals() instead of
// identity, so unchanged rows skip recomposition).
//
// UniFFI records are generated with `var` fields but are values copied out
// of Rust: the app never mutates them, and each workspace snapshot is a new
// instance, so identity alone would re-compose every row on every snapshot.
uniffi.zeron_core.SessionRow
uniffi.zeron_core.ProjectRef
uniffi.zeron_core.PullRequest
