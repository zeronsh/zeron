name: UI tests

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'vendor/ironrdp-*/**'
      - '.github/actions/linux-ci/**'
      - 'scripts/ci/**'
      - 'scripts/*cursor-sdk*'
      - '.github/workflows/cursor-*.yml'
      - 'scripts/test-linux-browser.sh'
      - 'scripts/test-remote-desktop.sh'
      - 'scripts/test-rdp-xrdp.sh'
      - 'scripts/collect-rdp-licenses.py'
      - '.github/workflows/ui-tests.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'vendor/ironrdp-*/**'
      - '.github/actions/linux-ci/**'
      - 'scripts/ci/**'
      - 'scripts/*cursor-sdk*'
      - '.github/workflows/cursor-*.yml'
      - 'scripts/test-linux-browser.sh'
      - 'scripts/test-remote-desktop.sh'
      - 'scripts/test-rdp-xrdp.sh'
      - 'scripts/collect-rdp-licenses.py'
      - '.github/workflows/ui-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rdp-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Protocol, TLS, input, clipboard and lifecycle contracts
        run: cargo test --locked -p ironrdp-svc -p ironrdp-dvc -p zeron-rdp
      - name: Build direct interoperability probe
        run: cargo build --release --locked -p zeron-rdp --example probe
      - name: Real xrdp login, Unicode input, clipboard and reactivation
        timeout-minutes: 5
        env:
          CONTAINER_RUNTIME: docker
        run: scripts/test-rdp-xrdp.sh "$RUNNER_TEMP/rdp-protocol"
      - name: Upload RDP interoperability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdp-protocol
          path: ${{ runner.temp }}/rdp-protocol
          if-no-files-found: warn

  # Every Linux Rust test that is not UI: one build, one nextest run (see
  # scripts/ci/test-core.sh). Replaces session-sync-regressions and the Rust
  # steps of cursor-compatibility and preview-tests.
  core-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-ci
        with:
          rust-cache: core
          save-rust-cache: 'true'
      - name: Harness, engine, sync, update, doc and preview tests
        run: scripts/ci/test-core.sh

  ui-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-ci
        with:
          rust-cache: ui
          save-rust-cache: 'true'
          apt-cache: gpui
          apt-packages: >-
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
            libx11-dev libxcb1-dev libx11-xcb-dev
            libfontconfig1-dev libfreetype-dev libasound2-dev
            libvulkan-dev pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev
      - name: UI and headless layout regressions
        run: cargo nextest run --config-file scripts/ci/nextest.toml --locked --no-fail-fast -p zeron-ui --lib

  linux-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-ci
        with:
          # Same dependency graph as ui-tests, which saves this cache on main.
          rust-cache: ui
          apt-cache: browser
          apt-recommends: 'true'
          apt-packages: >-
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
            libx11-dev libxcb1-dev libx11-xcb-dev libfontconfig1-dev
            libfreetype-dev libasound2-dev libvulkan-dev pkg-config cmake
            libwebkit2gtk-4.1-dev libjson-glib-dev xvfb xdotool openbox
            weston ffmpeg imagemagick fonts-noto-cjk
      - name: Native Remote Desktop rendering on X11 and Wayland
        run: |
          cargo build --locked -p zeron-ui --example remote-desktop-fixture --features remote-desktop-fixture
          RDP_FIXTURE_BINARY=target/debug/examples/remote-desktop-fixture scripts/test-remote-desktop.sh "$RUNNER_TEMP/rdp-native"
      - name: Upload Linux Remote Desktop rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdp-native-linux
          path: ${{ runner.temp }}/rdp-native
          if-no-files-found: warn
      - name: Build browser fixture
        run: cargo build --locked -p zeron-ui --example browser-fixture --features browser-fixture
      - name: X11 and Wayland browser regressions
        timeout-minutes: 5
        env:
          RUST_LOG: gpui_wgpu=info
          BROWSER_FIXTURE_BINARY: target/debug/examples/browser-fixture
        run: |
          scripts/test-linux-browser.sh "$RUNNER_TEMP/linux-browser/default"
          VK_DRIVER_FILES=/dev/null scripts/test-linux-browser.sh "$RUNNER_TEMP/linux-browser/opengl"
      - name: Upload native browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-browser
          path: ${{ runner.temp }}/linux-browser
          if-no-files-found: warn
