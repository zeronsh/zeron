name: zgx beta

# Zeron's beta channel: the next Zeron app, built as release.yml builds a
# stable one (zgx-build.yml: apps/zgx with the engine from this same commit
# inside, on macOS, Linux and Windows). The point of a beta is to test what's
# next, the engine too. Testers keep their data and device; the app updates
# itself from the beta channel and goes back to
# Stable when they turn beta off (crates/update `channel`).
#
# Signed as release.yml signs: macOS only. Linux and Windows aren't signed.
#
# Published to the beta channel only — R2 `comet-native-releases/beta/*`
# (zeron.sh/releases/beta/*, the manifest last) — and as a GitHub
# pre-release that's never the latest. It never writes release.yml's
# channel: not `comet-native-releases/manifest.json`, not `latest.txt`.
#
# Trigger: push a tag `beta-v<workspace version>-beta.<n>`, the workspace
# version being the next release's (newer than the latest stable):
#   git tag beta-v0.2.136-beta.1 && git push origin beta-v0.2.136-beta.1
# or run it by hand with a version (builds and uploads the artifacts, no
# release, no channel), and optionally only some of the platforms.
#
# Armed by the repository variable ZGX_BETA_ENABLED=true: until it's set,
# every job is skipped. The `apple-release` and `cloudflare` environments
# must also admit `beta-v*` tags, or a tag's run gets no signing,
# notarization or R2 credentials.

on:
  push:
    tags: ["beta-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: The beta's version, <workspace version>-beta.<n>.
        type: string
        required: true
      platforms:
        description: Which to build (a run by hand).
        type: string
        default: macos linux windows

permissions:
  contents: read

# By version, so a by-hand run of another version doesn't queue behind this one.
concurrency:
  group: zgx-beta-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  version:
    if: github.repository == 'zeronsh/zeron' && vars.ZGX_BETA_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      engine: ${{ steps.version.outputs.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: version (beta-v<workspace version>-beta.<n>, newer than stable)
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          workspace="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="${GITHUB_REF_NAME#beta-v}"
          else
            version="$VERSION_INPUT"
          fi
          case "$version" in
            "$workspace"-beta.*) ;;
            *) echo "$version is not $workspace-beta.<n> (Cargo.toml's version is $workspace)"; exit 1 ;;
          esac
          number="${version#"$workspace"-beta.}"
          case "$number" in
            ''|*[!0-9]*) echo "the beta number '$number' is not a number"; exit 1 ;;
          esac
          stable="$(curl -fsS --retry 3 https://zeron.sh/releases/latest.txt)"
          # A beta is of the next release: newer than the stable it carries.
          if [ "$(printf '%s\n%s\n' "$stable" "$workspace" | sort -V | tail -1)" != "$workspace" ] || [ "$stable" = "$workspace" ]; then
            echo "the workspace's $workspace isn't newer than stable $stable: bump it first"; exit 1
          fi
          {
            echo "version=$version"
            echo "engine=$version"
          } >>"$GITHUB_OUTPUT"

  # Built as a stable release is (zgx-build.yml), with the beta's version.
  build:
    needs: version
    uses: ./.github/workflows/zgx-build.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}
      platforms: ${{ github.event_name == 'push' && 'macos linux windows' || inputs.platforms }}
      # The edge's: its `beta/` is the beta channel, and stable's manifest
      # and files, for going back, are beside it.
      windows-feed: https://zeron.sh/releases

  # The GitHub pre-release: never the latest release (Zeron's updater and
  # download links follow releases/latest), with the beta's manifest.
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/beta-v')
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # The engine inside is this commit's, the beta's own version.
      ENGINE: ${{ needs.version.outputs.engine }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: artifacts and the beta manifest
        run: |
          ls -l dist/
          # Stable's artifacts, but for a standalone Windows .exe: the beta
          # can't run without the folder beside it.
          for platform in linux-x86_64.tar.gz linux-aarch64.tar.gz \
              macos-arm64.dmg macos-arm64-app.tar.gz \
              windows-x86_64.zip windows-x86_64-setup.exe; do
            test -f "dist/zeron-$VERSION-$platform" \
              || { echo "missing artifact for $VERSION: $platform"; exit 1; }
          done
          # crates/update's Manifest: the beta's version, the engine it
          # carries and its macOS floor, which only macOS reads.
          manifest=$(jq -n --arg version "$VERSION" --arg engine "$ENGINE" \
            '{version: $version, engineVersion: $engine, minimumMacOS: "13.0", files: {}}')
          for f in dist/*; do
            sha=$(sha256sum "$f" | cut -d' ' -f1)
            manifest=$(jq --arg name "$(basename "$f")" --arg sha "$sha" \
              '.files[$name] = {sha256: $sha}' <<<"$manifest")
          done
          printf '%s' "$manifest" > beta-manifest.json
          cat beta-manifest.json
      # Published releases are immutable and take no more files, and this
      # action publishes a prerelease before uploading unless it's a draft. So:
      # a draft, its files, then published in the next step.
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        id: draft
        with:
          name: Zeron ${{ needs.version.outputs.version }}
          prerelease: true
          draft: true
          make_latest: "false"
          # As release.yml: re-running this job after a failed upload keeps
          # the files already there.
          overwrite_files: false
          files: |
            dist/*
            beta-manifest.json
          body: |
            Zeron ${{ needs.version.outputs.version }}, a beta of the next Zeron app.

            - It replaces Zeron and keeps your Zeron: the same data, account and device.
            - Once installed, it updates from the beta channel. To go back, turn off **Get beta updates** in Settings → About & updates; Zeron then installs the latest stable release.
            - macOS 13 or later on Apple silicon; Linux x86_64 and aarch64 (run `install.sh` from the tarball); Windows x86_64 (the installer or the zip).
      - name: publish the draft (a prerelease, never the latest)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          # (Published already when this job runs again.)
          if [ "$(gh api "$endpoint" --jq .draft)" = true ]; then
            gh api -X PATCH "$endpoint" -F draft=false -F prerelease=true -f make_latest=false --jq '{tag_name, draft, prerelease}'
          fi
          test "$(gh api "$endpoint" --jq '.draft')" = false
          test "$(gh api "$endpoint" --jq '.prerelease')" = true
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" != "$GITHUB_REF_NAME"

  # The beta channel on R2: zeron.sh/releases/beta/*. Every key is under
  # `beta/`: never the stable manifest.json or latest.txt.
  channel:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/beta-v')
    needs: [version, build, release]
    runs-on: ubuntu-latest
    environment: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b57dde68ee5964dccc025437b5478a5b
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: the manifest the release carries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern beta-manifest.json --dir .
      - name: upload to R2 (zeron.sh/releases/beta/*)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          put() {
            case "$1" in
              beta/?*) ;;
              *) echo "refusing to write $1: only beta/* is this workflow's"; exit 1 ;;
            esac
            # The Cloudflare API returns the odd 502; retry each object.
            for attempt in 1 2 3 4 5; do
              npx wrangler@4 r2 object put "comet-native-releases/$1" --file "$2" --remote && return 0
              echo "upload of $1 failed (attempt $attempt), retrying" >&2
              sleep $((attempt * 10))
            done
            return 1
          }
          for f in dist/*; do
            put "beta/$(basename "$f")" "$f"
          done
          # This beta's own, beside its files (crates/update
          # `windows::pinned_release`), then, last, so no reader sees a
          # version before its files, the channel's.
          VERSION="${GITHUB_REF_NAME#beta-v}"
          put "beta/manifest-$VERSION.json" beta-manifest.json
          put beta/manifest.json beta-manifest.json
