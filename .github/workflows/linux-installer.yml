name: Linux installer

# Called by ci.yml when the installers or the desktop entry change.
on:
  workflow_call:
    inputs:
      pass-key:
        description: Cache key prefix under which each job records its pass (ci.yml); empty records nothing.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  desktop-entry:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Desktop entry validator
        # Skips apt when the runner image already has it; otherwise the install
        # retries and is bounded instead of hanging on a stalled mirror.
        run: command -v desktop-file-validate || bash scripts/ci/apt-install.sh desktop-file-utils
      # Both installers, offline, under a throwaway HOME (no network, no systemd).
      - name: Installers write a valid launcher entry
        run: scripts/test-linux-desktop-entry.sh
      - name: Record the pass (CI skips this job while its inputs stay the same)
        if: inputs.pass-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: rust-toolchain.toml
          key: ${{ inputs.pass-key }}-desktop-entry
