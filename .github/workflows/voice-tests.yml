name: Native Codex voice

# Called by ci.yml nightly, on manual runs and with the `ci:full` label
# (scripts/ci/plan.py NIGHTLY_SUITES). The rest of voice is tested where it is
# built: protocol, transport, MCP and voice-media in core-tests
# (scripts/ci/test-core.sh), the mobile voice and orb core in ios-core
# (macos.yml), voice-media on Windows in windows.yml.
on:
  workflow_call:
    inputs:
      pass-key:
        description: Cache key prefix under which each job records its pass (ci.yml); empty records nothing.
        type: string
        default: ''
      skip:
        description: JSON list of jobs that already passed on the same inputs (ci.yml skips them).
        type: string
        default: '[]'

permissions:
  contents: read

jobs:
  # The WebRTC AEC3 audio stack (zeron-audio; its meson build is most of the
  # job) and the Python fixtures.
  offline-linux:
    if: ${{ !contains(fromJSON(inputs.skip), 'offline-linux') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Development runtime projection and split-host diagnostic fixtures (no downloads, Codex, microphone or provider)
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_voice_packaging.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_voice_remote*.py' -v
      - uses: ./.github/actions/linux-ci
        with:
          rust-cache: voice
          save-rust-cache: 'true'
          apt-cache: voice
          apt-packages: >-
            libasound2-dev clang libclang-dev pkg-config meson ninja-build
      - name: Native audio and WebRTC AEC3
        run: cargo nextest run --config-file scripts/ci/nextest.toml --locked --no-fail-fast -p zeron-audio --features aec --lib
      - name: Record the pass (CI skips this job while its inputs stay the same)
        if: inputs.pass-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: rust-toolchain.toml
          key: ${{ inputs.pass-key }}-offline-linux

  # The packaged Windows media runtime: download, project and initialize it
  # without audio devices or a provider.
  windows-runtime:
    if: ${{ !contains(fromJSON(inputs.skip), 'windows-runtime') }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Development runtime projection fixtures (no downloads or audio devices)
        run: python -m unittest discover -s scripts/tests -p 'test_voice_packaging.py' -v
      - name: Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main writes the cache: pull request caches evicted main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Initialize a projected Windows runtime (no provider or audio devices)
        run: |
          $env:ZERON_VOICE_MEDIA_DIR = Join-Path $env:RUNNER_TEMP 'zeron-media/codex-resources/voice'
          python scripts/package-voice-runtime.py --download --destination $env:ZERON_VOICE_MEDIA_DIR
          if ($LASTEXITCODE -ne 0) { throw 'Voice runtime packaging failed' }
          cargo test --locked -p zeron-voice-media --lib packaged_native_runtime_initializes_without_audio_devices -- --ignored
      - name: Record the pass (CI skips this job while its inputs stay the same)
        if: inputs.pass-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: rust-toolchain.toml
          key: ${{ inputs.pass-key }}-windows-runtime
