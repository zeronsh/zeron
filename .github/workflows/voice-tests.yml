name: Native Codex voice

# Called by ci.yml, which decides when voice runs (scripts/ci/plan.py) and holds
# the runners for it (scripts/ci/admit.py). The protocol, transport, MCP and
# engine voice tests that need no audio stack run in core-tests
# (scripts/ci/test-core.sh) with the rest of the Linux Rust suites.
on:
  workflow_call:
    inputs:
      pass-key:
        description: Cache key prefix under which each job records its pass (ci.yml); empty records nothing.
        type: string
        default: ''
      skip:
        description: JSON list of jobs that already passed on the same inputs (ci.yml skips them).
        type: string
        default: '[]'
      native-oses:
        description: JSON list of the native platform checks to run.
        type: string
        default: '["macos-14", "windows-latest"]'

permissions:
  contents: read

jobs:
  # Native audio (WebRTC AEC3), the mobile voice/orb core and the Python
  # fixtures, in one build. Used to be 14 `cargo test` builds capped at two
  # compiler jobs (~40 minutes).
  offline-linux:
    if: ${{ !contains(fromJSON(inputs.skip), 'offline-linux') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Development runtime projection and split-host diagnostic fixtures (no downloads, Codex, microphone or provider)
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_voice_packaging.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_voice_remote*.py' -v
      - uses: ./.github/actions/linux-ci
        with:
          rust-cache: voice
          save-rust-cache: 'true'
          apt-cache: voice
          apt-packages: >-
            libasound2-dev clang libclang-dev pkg-config meson ninja-build libwayland-dev
            libxkbcommon-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-xcb-dev
            libxrandr-dev libxi-dev libxcursor-dev libx11-dev libxinerama-dev libegl1-mesa-dev
            libvulkan-dev libfontconfig1-dev libfreetype6-dev libssl-dev libdbus-1-dev
      - name: Native audio and WebRTC AEC3, mobile voice and orb
        run: >-
          cargo nextest run --config-file scripts/ci/nextest.toml --locked --no-fail-fast
          -p zeron-audio -p zeron-mobile --features zeron-audio/aec --lib
          -E 'package(zeron-audio) | (package(zeron-mobile) & (test(voice) | test(orb)))'
      - name: Record the pass (CI skips this job while its inputs stay the same)
        if: inputs.pass-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: rust-toolchain.toml
          key: ${{ inputs.pass-key }}-offline-linux

  native-platform-check:
    if: inputs.native-oses != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.native-oses) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Split-host diagnostic fixtures (no Codex, microphone or provider)
        if: runner.os == 'macOS'
        run: python3 -m unittest discover -s scripts/tests -p 'test_voice_remote*.py' -v
      - name: Development runtime projection fixtures (no downloads or audio devices)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s scripts/tests -p 'test_voice_packaging.py' -v
      - name: Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main writes the cache: pull request caches evicted main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Compile subscription bridge without audio hardware or provider access
        run: cargo check --locked -p zeron-harness -p zeron-engine
      - name: Installed and development runtime resolution
        run: cargo test --locked -p zeron-voice-media --lib
      - name: Initialize a projected Windows runtime (no provider or audio devices)
        if: runner.os == 'Windows'
        run: |
          $env:ZERON_VOICE_MEDIA_DIR = Join-Path $env:RUNNER_TEMP 'zeron-media/codex-resources/voice'
          python scripts/package-voice-runtime.py --download --destination $env:ZERON_VOICE_MEDIA_DIR
          if ($LASTEXITCODE -ne 0) { throw 'Voice runtime packaging failed' }
          cargo test --locked -p zeron-voice-media --lib packaged_native_runtime_initializes_without_audio_devices -- --ignored
      - name: Record the pass (CI skips this job while its inputs stay the same)
        if: inputs.pass-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: rust-toolchain.toml
          key: ${{ inputs.pass-key }}-native-platform-check-${{ matrix.os }}
