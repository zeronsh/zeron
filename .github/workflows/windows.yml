name: Windows tests

# Called by ci.yml (which decides when Windows runs and holds the runners for
# it, see scripts/ci/admit.py). Dispatch it by hand for the native GUI probes.
on:
  workflow_call:
    inputs:
      pass-key:
        description: Cache key prefix under which each job records its pass (ci.yml); empty records nothing.
        type: string
        default: ''
      skip:
        description: JSON list of jobs that already passed on the same inputs (ci.yml skips them).
        type: string
        default: '[]'
      native_gui:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      native_gui:
        description: 'Run native GUI/pixel probes (requires a usable desktop and Direct3D)'
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

# Pull requests and main leave out slow and soak tests (scripts/ci/nextest.toml `ci` profile).
env:
  NEXTEST_PROFILE: ${{ github.event_name == 'schedule' && 'default' || 'ci' }}
  ZERON_STRESS_ROUNDS: ${{ github.event_name == 'schedule' && '100' || '14' }}

jobs:
  # Every Windows crate suite in ONE build: separate `cargo test` invocations
  # with different package sets each recompiled the shared dependency graph
  # (they used to be three jobs, ~20 min each, almost all of it compiling).
  # nextest runs each test in its own process, so zeron-ui's tests run side by
  # side (the old in-process `--test-threads=1` run needed them one at a time).
  tests:
    if: ${{ !contains(fromJSON(inputs.skip || '[]'), 'tests') }}
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/windows-ci-setup
        with:
          save-rust-cache: 'true'
      - name: Build tests
        run: >-
          cargo nextest run --config-file scripts/ci/nextest.toml --no-run --release --locked
          -p zeron-ui -p zeron-harness -p gpui_windows -p zeron -p zeron-update -p zeron-proto -p zeron-engine -p zeron-voice-media
          --features zeron-harness/native-fixture
          --lib --bins
          --test codex_availability --test windows_native --test opencode --test cursor_shim --test pi_rpc
          --test background_engine --test noop_browser
          --test worktree_on_run --test codex_catalog --test codex_login_resolution --test auth
      # Same selection as the old commands:
      #   UI: the zeron-ui library (native_diff_font_geometry included)
      #   native harness security/integration + portable driver suites (OpenCode HTTP/SSE,
      #     the Cursor shim, Pi RPC; the shell- and python-fixture suites are unix-only)
      #   shader layout, application and updater, worktree paths, engine unit/catalog/login/auth
      #   voice-media (runtime resolution; used to be its own build in voice-tests.yml)
      # gpui_windows (shader layout) is a git dependency, which a filterset cannot name: the last
      # clause picks it as "not one of the workspace packages above".
      - name: UI, harness, shader layout, application, updater and engine tests
        env:
          RUST_BACKTRACE: '1'
        run: >-
          cargo nextest run --config-file scripts/ci/nextest.toml --release --locked --no-fail-fast
          -p zeron-ui -p zeron-harness -p gpui_windows -p zeron -p zeron-update -p zeron-proto -p zeron-engine -p zeron-voice-media
          --features zeron-harness/native-fixture
          --lib --bins
          --test codex_availability --test windows_native --test opencode --test cursor_shim --test pi_rpc
          --test background_engine --test noop_browser
          --test worktree_on_run --test codex_catalog --test codex_login_resolution --test auth
          -E "(package(zeron-ui) & kind(lib)) | package(zeron-harness) | package(zeron) | package(zeron-update) | (package(zeron-voice-media) & kind(lib)) | (package(zeron-proto) & test(device_paths)) | (package(zeron-engine) & (kind(lib) | binary_id(zeron-engine::codex_catalog) | binary_id(zeron-engine::codex_login_resolution) | binary_id(zeron-engine::auth) | (binary_id(zeron-engine::worktree_on_run) & test(worktree_location_)))) | (not package(zeron-ui) & not package(zeron-harness) & not package(zeron) & not package(zeron-update) & not package(zeron-proto) & not package(zeron-engine) & not package(zeron-voice-media) & test(layout))"
      - name: Record the pass (CI skips this job while its inputs stay the same)
        if: inputs.pass-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: rust-toolchain.toml
          key: ${{ inputs.pass-key }}-tests

  # Restores the cache `tests` saves: the same dependencies, built with the same profile.
  app:
    if: ${{ !contains(fromJSON(inputs.skip || '[]'), 'app') }}
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/windows-ci-setup
      - name: Build application
        run: cargo build --release --locked -p zeron
      - name: Verify portable and installer packaging
        run: ./scripts/package-windows.ps1 -ReleasesUrl "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download"
      - name: Installer install/uninstall
        run: ./scripts/test-windows-installer.ps1
      - name: GUI subsystem and redirected CLI output
        run: ./scripts/test-windows-startup.ps1
      - name: CLI startup without HOME
        run: |
          # Exercise real path resolution without touching the runner's account.
          # Port zero cannot connect to another running engine.
          $env:HOME = $null
          $env:ZERON_DATA_DIR = $null
          $env:ZERON_EDGE_TOKEN = $null
          $env:ZERON_IPC_PORT = '0'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "zeron smoke O'Brien 日本語"
          $expected = Join-Path $env:LOCALAPPDATA 'Zeron'
          $probe = [Diagnostics.ProcessStartInfo]::new()
          $probe.FileName = (Resolve-Path -LiteralPath './target/release/zeron.exe').Path
          $probe.Arguments = 'status'
          $probe.UseShellExecute = $false
          $probe.CreateNoWindow = $true
          $probe.RedirectStandardOutput = $true
          $probe.RedirectStandardError = $true
          $process = [Diagnostics.Process]::Start($probe)
          try {
            $stdout = $process.StandardOutput.ReadToEndAsync()
            $stderr = $process.StandardError.ReadToEndAsync()
            if (-not $process.WaitForExit(10000)) {
              $process.Kill()
              throw 'Isolated status probe timed out'
            }
            if ($process.ExitCode -ne 0) { throw "Status failed: $($stderr.Result)" }
            $output = $stdout.Result -split '\r?\n'
          } finally { $process.Dispose() }
          $output
          if (-not ($output -contains "Data dir: $expected")) {
            throw 'Windows startup did not select LOCALAPPDATA/Zeron'
          }
          if (-not ($output -match '^Mode:\s+local only$')) {
            throw 'An isolated Windows startup must select local-only mode'
          }
      - name: Build rendering fixture
        if: ${{ inputs.native_gui }}
        run: cargo build --release --locked -p zeron-ui --example windows-render-fixture --features windows-render-fixture
      - name: Upload GUI test binaries
        if: ${{ inputs.native_gui }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-gui-binaries
          path: |
            target/release/zeron.exe
            target/release/examples/windows-render-fixture.exe
          if-no-files-found: error
          retention-days: 1
      - name: Record the pass (CI skips this job while its inputs stay the same)
        if: inputs.pass-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: rust-toolchain.toml
          key: ${{ inputs.pass-key }}-app

  native-gui:
    if: ${{ inputs.native_gui }}
    needs: app
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-gui-binaries
          path: target/release
      - name: App lifecycle tests
        run: ./scripts/test-windows-lifecycle.ps1
      - name: Rendering tests
        run: ./scripts/test-windows-rendering.ps1
      - name: Upload GUI test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-native-probes
          path: |
            target/windows-render-*/capture.png
            target/windows-render-*/measurements.json
            target/windows-render-*/stdout.txt
            target/windows-render-*/stderr.txt
            target/windows-lifecycle-*/result.txt
            target/windows-lifecycle-*/run-*.txt
          if-no-files-found: warn
