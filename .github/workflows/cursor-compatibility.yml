name: Cursor compatibility
# Pull requests and main: called by ci.yml (with rust-tests off: core-tests
# already runs them there). Also called by release.yml and dispatched by
# cursor-sdk-update.yml on its update branch.
on:
  workflow_dispatch:
    inputs:
      rust-tests:
        type: boolean
        default: true
  workflow_call:
    inputs:
      pass-key:
        description: Cache key prefix under which each job records its pass (ci.yml); empty records nothing.
        type: string
        default: ''
      rust-tests:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  cursor-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Dependency updater validation
        run: python3 scripts/test-update-cursor-sdk.py
      - name: Install the exact SDK selected by this engine
        run: |
          pin=$(python3 -c 'import re; print(re.search(r"const CURSOR_SDK_PIN: &str = \"([^\"]+)\"", open("crates/harness/src/cursor/mod.rs").read())[1])')
          npm install --prefix "$RUNNER_TEMP/cursor-sdk-contract" --ignore-scripts --no-audit --no-fund "$pin"
      - name: Actual SDK token expiry, stream invalidation, and transient auth recovery
        run: node scripts/test-cursor-sdk-auth.mjs "$RUNNER_TEMP/cursor-sdk-contract/node_modules/@cursor/sdk"
      - name: Record the pass (CI skips this job while its inputs stay the same)
        if: inputs.pass-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: rust-toolchain.toml
          key: ${{ inputs.pass-key }}-cursor-compatibility

  # The Rust half (harness compatibility, steering, session recovery, durable
  # commands, message delivery, native Pi RPC) is part of the `core-tests` job
  # of ui-tests.yml, which ci.yml runs on pull requests and main. Run it here
  # for the other callers: release.yml (tag push), cursor-sdk-update.yml
  # (dispatch on the update branch) and manual runs.
  rust-tests:
    if: inputs.rust-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/linux-ci
        with:
          rust-cache: core # saved by core-tests in ui-tests.yml
      - name: Harness, engine, sync, update, doc and preview tests
        run: scripts/ci/test-core.sh
