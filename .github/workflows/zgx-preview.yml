name: zgx preview

# Zeron Preview: the zgx app (apps/zgx, its `preview` feature) and the engine
# built from the same commit, in their own bundle ("Zeron Preview.app",
# sh.zeron.preview, data in ~/.zeron-preview) that installs beside Zeron.app
# and never replaces it (scripts/package-zgx-preview.sh). Published as a
# GitHub pre-release, never the latest release, and to the preview channel
# only: `comet-native-releases/preview/*` (zeron.sh/releases/preview/*, which
# the app's About and its engine's updater read). This workflow never writes
# release.yml's channel, `comet-native-releases/manifest.json` or
# `latest.txt`.
#
# Trigger: push a tag `preview-v<workspace version>-<n>`, the workspace
# version being Cargo.toml's and n this version's preview number:
#   git tag preview-v0.2.132-1 && git push origin preview-v0.2.132-1
# or run it by hand (workflow_dispatch: builds and uploads the artifacts, no
# release, no channel).
#
# Armed by the repository variable ZGX_PREVIEW_ENABLED=true: until it is
# set, every job is skipped, in any repository. The `apple-release` and
# `cloudflare` environments must also admit `preview-v*` tags (their
# deployment policies), or a tag's run gets no signing, notarization or R2
# credentials.

on:
  push:
    tags: ["preview-v*"]
  workflow_dispatch:
    inputs:
      number:
        description: The preview's number (the bundle's build is <version>.<number>).
        type: string
        default: "0"

permissions:
  contents: read

concurrency:
  group: zgx-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Apple silicon only, as release.yml's macOS build.
  macos:
    if: github.repository == 'zeronsh/zeron' && vars.ZGX_PREVIEW_ENABLED == 'true'
    runs-on: macos-latest
    timeout-minutes: 120
    environment: ${{ startsWith(github.ref, 'refs/tags/preview-v') && 'apple-release' || '' }}
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
      AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
      AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      preview: ${{ steps.version.outputs.preview }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: version (tag == preview-v<workspace version>-<n>)
        id: version
        env:
          NUMBER_INPUT: ${{ inputs.number }}
        run: |
          version="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="${GITHUB_REF_NAME#preview-v}"
            case "$tag" in
              "$version"-*) number="${tag#"$version"-}" ;;
              *) echo "tag $GITHUB_REF_NAME is not preview-v$version-<n> (Cargo.toml's version is $version)"; exit 1 ;;
            esac
          else
            number="$NUMBER_INPUT"
          fi
          case "$number" in
            ''|*[!0-9]*) echo "the preview number '$number' is not a number"; exit 1 ;;
          esac
          {
            echo "version=$version"
            echo "number=$number"
            echo "preview=$version-$number"
          } >>"$GITHUB_OUTPUT"
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      # zgx's terminals are Ghostty's, built with Zig 0.16 (zgx-ghostty-sys).
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/zgx-ghostty
          key: zgx-ghostty-${{ hashFiles('apps/zgx/Cargo.lock') }}
          restore-keys: zgx-ghostty-
      # Two workspaces: the engine's (the root) and the app's (apps/zgx).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: zgx-preview
          workspaces: |
            . -> target
            apps/zgx -> target
      - name: import Developer ID certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          pass="$(openssl rand -hex 16)"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 -d >"$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          [ -n "$identity" ] || { echo "p12 contains no Developer ID Application identity"; exit 1; }
          echo "CODESIGN_IDENTITY=$identity" >>"$GITHUB_ENV"
      - name: notary credentials
        if: env.AC_API_KEY_P8 != ''
        run: |
          printf '%s' "$AC_API_KEY_P8" >"$RUNNER_TEMP/ac_api_key.p8"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/ac_api_key.p8"
            echo "NOTARY_KEY_ID=$AC_API_KEY_ID"
            echo "NOTARY_ISSUER_ID=$AC_API_ISSUER_ID"
          } >>"$GITHUB_ENV"
      - name: package dmg
        env:
          PREVIEW_NUMBER: ${{ steps.version.outputs.number }}
          CARGO_FLAGS: --locked
        run: scripts/package-zgx-preview.sh
      - name: inspect the bundle
        run: |
          app="target/package-preview/Zeron Preview.app"
          plutil -p "$app/Contents/Info.plist"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = sh.zeron.preview
          test -x "$app/Contents/MacOS/zeron-zgx" && test -x "$app/Contents/MacOS/zeron-engine"
          test -f "$app/Contents/Resources/ui/app.luau"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements - "$app"
          # A tag's build is signed and notarized: Gatekeeper must take it.
          if [ -n "${NOTARY_KEY_PATH:-}" ]; then
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zgx-preview-macos-${{ runner.arch }}
          path: |
            target/package-preview/*.dmg
            target/package-preview/*.tar.gz
          if-no-files-found: error

  # The GitHub pre-release: never the latest release (Zeron's updater and
  # download links follow releases/latest).
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/preview-v')
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.macos.outputs.version }}
      PREVIEW: ${{ needs.macos.outputs.preview }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: artifacts and their manifest
        run: |
          ls -l dist/
          test -f "dist/zeron-preview-$PREVIEW-macos-arm64.dmg"
          test -f "dist/zeron-preview-$PREVIEW-macos-arm64-app.tar.gz"
          # `version` is the workspace's (what the engine and About compare
          # with their own); `preview` names this build.
          manifest=$(jq -n --arg version "$VERSION" --arg preview "$PREVIEW" \
            '{version: $version, preview: $preview, files: {}}')
          for f in dist/*; do
            sha=$(sha256sum "$f" | cut -d' ' -f1)
            manifest=$(jq --arg name "$(basename "$f")" --arg sha "$sha" \
              '.files[$name] = {sha256: $sha}' <<<"$manifest")
          done
          printf '%s' "$manifest" > preview-manifest.json
          cat preview-manifest.json
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Zeron Preview ${{ needs.macos.outputs.preview }}
          prerelease: true
          make_latest: "false"
          files: |
            dist/*
            preview-manifest.json
          body: |
            Zeron Preview ${{ needs.macos.outputs.preview }}: the next Zeron app, as a separate app beside Zeron (it never replaces it).

            - Open the dmg and drag **Zeron Preview** to Applications. It keeps its own data (`~/.zeron-preview`) and runs its own engine, so it shows up in your account as a second device, "<this Mac> · Preview".
            - It signs in to your production Zeron account.
            - Apple silicon only.

  # The preview channel on R2: zeron.sh/releases/preview/* (for a later
  # self-update; About and the engine read its manifest now). Every key is
  # under `preview/`: never the Zeron app's manifest.json or latest.txt.
  channel:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/preview-v')
    needs: [macos, release]
    runs-on: ubuntu-latest
    environment: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b57dde68ee5964dccc025437b5478a5b
      PREVIEW: ${{ needs.macos.outputs.preview }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: the manifest the release carries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern preview-manifest.json --dir .
      - name: upload to R2 (zeron.sh/releases/preview/*)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          put() {
            case "$1" in
              preview/?*) ;;
              *) echo "refusing to write $1: only preview/* is this workflow's"; exit 1 ;;
            esac
            npx wrangler@4 r2 object put "comet-native-releases/$1" --file "$2" --remote
          }
          for f in dist/*; do
            put "preview/$(basename "$f")" "$f"
          done
          # Last, so no reader sees a version before its files.
          put preview/manifest.json preview-manifest.json
