name: deploy-edge

# Cloud deployment is an explicit operator action. This workflow deploys only
# the Glitch Flow edge; it does not touch Zeron's landing or redirect Workers.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edge:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment configuration
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set this repository's CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID variable."
            exit 1
          fi
          if [ "$CLOUDFLARE_ACCOUNT_ID" = "b57dde68ee5964dccc025437b5478a5b" ]; then
            echo "::error::Refusing to deploy to Zeron's inherited Cloudflare account."
            exit 1
          fi
          if grep -q 'REPLACE_WITH_WORKOS_CLIENT_ID' edge/wrangler.jsonc; then
            echo "::error::Set the Glitch Flow WorkOS client ID in edge/wrangler.jsonc before deploying."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - name: Install
        working-directory: edge
        run: npm ci
      - name: Typecheck
        working-directory: edge
        run: npm run typecheck
      - name: Test
        working-directory: edge
        run: npm test
      - name: Deploy edge
        working-directory: edge
        run: npx wrangler deploy
