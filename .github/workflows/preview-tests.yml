name: Preview networking

# Called by ci.yml when edge/ changes. The Rust networking tests run in
# core-tests (ui-tests.yml, Linux) and macos-native (macos.yml); this keeps the
# edge coordinator and the credential vault (edge/vault, its own package), in
# one job: each takes seconds, a runner of its own cost more than the tests.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  edge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            edge/package-lock.json
            edge/vault/package-lock.json
      - name: Coordinator
        working-directory: edge
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Credential vault
        if: ${{ !cancelled() }}
        working-directory: edge/vault
        run: |
          npm ci
          npm run typecheck
          npm test
