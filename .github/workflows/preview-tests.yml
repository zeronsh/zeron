name: Preview networking

# Called by ci.yml when edge/ changes. The Rust networking tests run in
# core-tests (ui-tests.yml, Linux) and macos-native (macos.yml); this keeps the
# edge coordinator and the credential vault (edge/vault, its own package), in
# one job: each takes seconds, a runner of its own cost more than the tests.
on:
  workflow_call:
    inputs:
      pass-key:
        description: Cache key prefix under which each job records its pass (ci.yml); empty records nothing.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  edge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            edge/package-lock.json
            edge/vault/package-lock.json
      - name: Coordinator
        working-directory: edge
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Credential vault
        if: ${{ !cancelled() }}
        working-directory: edge/vault
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Record the pass (CI skips this job while its inputs stay the same)
        if: inputs.pass-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rust-toolchain.toml
          key: ${{ inputs.pass-key }}-edge
