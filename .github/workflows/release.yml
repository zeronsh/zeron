name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Workspace version to build (for example 0.2.0)"
        required: true
        type: string
      release_surface:
        description: "Build only the macOS desktop distribution, or also publish Linux artifacts for Scaffold"
        required: true
        default: desktop
        type: choice
        options:
          - desktop
          - desktop-and-scaffold
      promotion_target:
        description: "Choose where to promote the exact candidate"
        required: true
        default: none
        type: choice
        options:
          - none
          - staging-candidate
          - staging
          - production
      scaffold_runtime_deployment:
        description: "When scaffold-runtime-version.txt changes, confirm compatible Scaffold is already deployed"
        required: true
        default: unchanged
        type: choice
        options:
          - unchanged
          - staging-deployed
          - production-deployed
      candidate_run_id:
        description: "Successful release run whose exact candidate should be reused for staging or production promotion; empty rebuilds"
        required: false
        default: ""
        type: string
      reviewed_sha:
        description: "Exact reviewed SHA, required for an unmerged build-only candidate"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: comet-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_epoch: ${{ steps.version.outputs.source_epoch }}
      release_surface: ${{ steps.version.outputs.release_surface }}
      promotion_target: ${{ steps.version.outputs.promotion_target }}
      candidate_run_id: ${{ steps.version.outputs.candidate_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        name: Verify release version against workspace metadata
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_RELEASE_SURFACE: ${{ inputs.release_surface }}
          REQUESTED_PROMOTION_TARGET: ${{ inputs.promotion_target }}
          REQUESTED_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          REQUESTED_REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: |
          set -euo pipefail
          workspace_version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)"
          test -n "$workspace_version"
          requested="$REQUESTED_VERSION"
          release_surface="$REQUESTED_RELEASE_SURFACE"
          promotion_target="$REQUESTED_PROMOTION_TARGET"
          case "$release_surface" in
            desktop|desktop-and-scaffold) ;;
            *)
              echo "::error::unsupported release surface: $release_surface"
              exit 1
              ;;
          esac
          case "$promotion_target" in
            none|staging-candidate|staging|production) ;;
            *)
              echo "::error::unsupported promotion target: $promotion_target"
              exit 1
              ;;
          esac
          # Publication requires merged main. A reviewed branch may only build
          # private Actions artifacts: target=none never enters a publisher job.
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            if [[ "$promotion_target" != none || ! "${REQUESTED_REVIEWED_SHA:-}" =~ ^[0-9a-f]{40}$ || "$REQUESTED_REVIEWED_SHA" != "$GITHUB_SHA" ]]; then
              echo "::error::publication requires merged main; unmerged build-only source requires its exact reviewed_sha"
              exit 1
            fi
          fi
          candidate_run_id="$REQUESTED_CANDIDATE_RUN_ID"
          if [[ -n "$candidate_run_id" ]]; then
            if [[ ! "$candidate_run_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::candidate_run_id must be a positive GitHub Actions run id"
              exit 1
            fi
            if [[ "$promotion_target" != "staging" && "$promotion_target" != "production" ]]; then
              echo "::error::candidate_run_id is only supported for staging or production promotion"
              exit 1
            fi
          fi
          if [[ "$requested" != "$workspace_version" ]]; then
            echo "::error::release version $requested does not match workspace version $workspace_version"
            exit 1
          fi
          cargo_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '[.packages[] | select(.name == "zeron") | .version] | unique | .[]')"
          if [[ "$cargo_version" != "$workspace_version" ]]; then
            echo "::error::Cargo metadata reports $cargo_version, expected $workspace_version"
            exit 1
          fi
          echo "version=$workspace_version" >> "$GITHUB_OUTPUT"
          echo "release_surface=$release_surface" >> "$GITHUB_OUTPUT"
          echo "promotion_target=$promotion_target" >> "$GITHUB_OUTPUT"
          echo "candidate_run_id=$candidate_run_id" >> "$GITHUB_OUTPUT"
          echo "source_epoch=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

  linux:
    if: ${{ inputs.candidate_run_id == '' && needs.version.outputs.release_surface == 'desktop-and-scaffold' }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: linux-x86_64
          - runner: ubuntu-24.04-arm
            artifact: linux-aarch64
    runs-on: ${{ matrix.runner }}
    env:
      COMET_RELEASE_VERSION: ${{ needs.version.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.version.outputs.source_epoch }}
      COMET_DEFAULT_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev
      - name: Select checked-in Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Package
        run: scripts/package-linux.sh
      - name: Verify packaged OMP writer probe
        run: |
          for archive in target/package/comet-*-linux-*.tar.gz; do
            unpacked="$(mktemp -d)"
            tar -xzf "$archive" -C "$unpacked"
            package="$unpacked/$(basename "$archive" .tar.gz)"
            scripts/verify-linux-omp-writer-probe.sh "$package/comet" "$package/zeron-engine"
            rm -rf "$unpacked"
          done
      - name: Record artifact checksums
        run: |
          cd target/package
          sha256sum comet-*.tar.gz > SHA256SUMS
          for archive in comet-*-linux-*.tar.gz; do
            binary="${archive%.tar.gz}/comet"
            digest="$(tar -xOf "$archive" "$binary" | sha256sum | cut -d' ' -f1)"
            printf '%s  %s\n' "$digest" "$binary"
          done > COMET_SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/package/comet-*.tar.gz
            target/package/SHA256SUMS
            target/package/COMET_SHA256SUMS
          if-no-files-found: error

  macos:
    if: ${{ inputs.candidate_run_id == '' }}
    needs: version
    runs-on: macos-15
    env:
      COMET_RELEASE_VERSION: ${{ needs.version.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.version.outputs.source_epoch }}
      COMET_DEFAULT_ENVIRONMENT: production
      # Promotion channels all reuse this production-identity bundle. The separate
      # standalone staging packaging step overrides both environment selectors.
      COMET_PACKAGE_ENVIRONMENT: production
      COMET_MACOS_SIGNING: distribution
      # Public release trust root, independent of notarization credentials.
      COMET_MACOS_SIGNING_TEAM_ID: ${{ vars.MACOS_SIGNING_TEAM_ID }}
      CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
      NOTARYTOOL_KEYCHAIN_PROFILE: crew-distribution
    steps:
      - uses: actions/checkout@v4
      - &require-apple-silicon
        name: Require Apple silicon runner
        run: test "$(uname -m)" = arm64
      - &import-signing-credentials
        name: Import Developer ID and notarization credentials
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          export CODESIGN_KEYCHAIN="$RUNNER_TEMP/crew-signing.keychain-db"
          echo "CODESIGN_KEYCHAIN=$CODESIGN_KEYCHAIN" >> "$GITHUB_ENV"
          for name in COMET_MACOS_SIGNING_TEAM_ID CODESIGN_IDENTITY MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required macOS distribution credential: $name (see dist/README.md)"
              exit 1
            fi
          done
          if [[ ! "$COMET_MACOS_SIGNING_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::vars.MACOS_SIGNING_TEAM_ID must be 10 uppercase alphanumeric characters"
            exit 1
          fi
          if [[ "$APPLE_TEAM_ID" != "$COMET_MACOS_SIGNING_TEAM_ID" ]]; then
            echo "::error::Notarization team must match vars.MACOS_SIGNING_TEAM_ID"
            exit 1
          fi
          certificate="$RUNNER_TEMP/crew-signing.p12"
          probe="$RUNNER_TEMP/crew-signing-probe"
          trap 'rm -f "$certificate" "$probe"' EXIT
          keychain_password="$(uuidgen)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$CODESIGN_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$CODESIGN_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$CODESIGN_KEYCHAIN"
          # codesign still uses the search list for private-key/chain discovery.
          # Preserve existing entries; delete-keychain removes our entry on cleanup.
          python3 - "$CODESIGN_KEYCHAIN" <<'PY'
          import shlex, subprocess, sys
          keychains = shlex.split(subprocess.check_output(["security", "list-keychains", "-d", "user"], text=True))
          if sys.argv[1] not in keychains:
              subprocess.run(["security", "list-keychains", "-d", "user", "-s", *keychains, sys.argv[1]], check=True)
          PY
          security import "$certificate" -P "$MACOS_CERTIFICATE_PASSWORD" -k "$CODESIGN_KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$CODESIGN_KEYCHAIN" >/dev/null
          xcrun notarytool store-credentials "$NOTARYTOOL_KEYCHAIN_PROFILE" \
            --keychain "$CODESIGN_KEYCHAIN" --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID"
          cp /usr/bin/true "$probe"
          codesign --force --options runtime --timestamp --verbose=4 \
            --sign "$CODESIGN_IDENTITY" --keychain "$CODESIGN_KEYCHAIN" "$probe"
          codesign --verify --strict --verbose=2 "$probe"
      - &rust-toolchain
        name: Select checked-in Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - &apple-ticket-transport
        name: Use TCP for Apple ticket delivery
        shell: bash
        run: |
          set -euo pipefail
          # https://github.com/actions/runner-images/issues/14924
          # Keep existing rules; this anchor lives only in the hosted release VM.
          if [[ "$(sudo pfctl -sr)" != *'anchor "com.apple/*"'* ]]; then
            echo "::error::Expected macOS packet-filter anchor is absent."
            exit 1
          fi
          printf 'block return out quick proto udp from any to any port 443\n' |
            sudo pfctl -a com.apple/crew-notary -f -
          sudo pfctl -E
      - name: Package
        run: scripts/package-macos.sh
      - name: Verify packaged native handoff command
        run: target/package/Crew.app/Contents/MacOS/comet session handoff --help
      - name: Record artifact checksums
        run: |
          cd target/package
          shasum -a 256 comet-*.dmg comet-*-app.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            target/package/comet-*.dmg
            target/package/comet-*.tar.gz
            target/package/SHA256SUMS
          if-no-files-found: error
      - name: Package standalone Crew Staging.app
        env:
          COMET_DEFAULT_ENVIRONMENT: staging
          COMET_PACKAGE_ENVIRONMENT: staging
        run: scripts/package-macos.sh
      - name: Record standalone staging artifact checksums
        run: |
          cd target/package/staging
          shasum -a 256 comet-staging-*.dmg comet-staging-*-app.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: macos-staging-arm64
          path: |
            target/package/staging/comet-staging-*.dmg
            target/package/staging/comet-staging-*-app.tar.gz
            target/package/staging/SHA256SUMS
          if-no-files-found: error
      - &remove-signing-credentials
        name: Remove temporary signing credentials
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "${CODESIGN_KEYCHAIN:-}" ]]; then
            security delete-keychain "$CODESIGN_KEYCHAIN"
          fi
          rm -f "$RUNNER_TEMP/crew-signing.p12"

  # Signed, notarized Crew Canary.app for installing over local Canary builds.
  # It is never part of the release candidate or any publication. Developer ID
  # keeps one stable code identity, so macOS privacy grants (Screen Recording,
  # Accessibility) survive Canary updates; ad-hoc builds lose them every rebuild.
  macos-canary:
    if: ${{ inputs.candidate_run_id == '' }}
    needs: version
    runs-on: macos-15
    env:
      COMET_RELEASE_VERSION: ${{ needs.version.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.version.outputs.source_epoch }}
      COMET_DEFAULT_ENVIRONMENT: canary
      COMET_PACKAGE_ENVIRONMENT: canary
      COMET_MACOS_SIGNING: distribution
      COMET_MACOS_SIGNING_TEAM_ID: ${{ vars.MACOS_SIGNING_TEAM_ID }}
      CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
      NOTARYTOOL_KEYCHAIN_PROFILE: crew-distribution
    steps:
      - uses: actions/checkout@v4
      - *require-apple-silicon
      - *import-signing-credentials
      - *rust-toolchain
      - uses: Swatinem/rust-cache@v2
      - *apple-ticket-transport
      - name: Package Crew Canary.app
        run: scripts/package-macos.sh
      - name: Verify packaged native handoff command
        run: '"target/package/canary/Crew Canary.app/Contents/MacOS/comet" session handoff --help'
      - name: Record canary artifact checksums
        run: |
          cd target/package/canary
          shasum -a 256 crew-upstream-canary-*.dmg crew-upstream-canary-*-app.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: macos-canary-arm64
          path: |
            target/package/canary/crew-upstream-canary-*.dmg
            target/package/canary/crew-upstream-canary-*-app.tar.gz
            target/package/canary/SHA256SUMS
          if-no-files-found: error
      - *remove-signing-credentials

  candidate:
    if: >-
      always() &&
      needs.version.result == 'success' &&
      (
        (
          inputs.candidate_run_id != '' &&
          needs.macos.result == 'skipped' &&
          needs.linux.result == 'skipped'
        ) ||
        (
          inputs.candidate_run_id == '' &&
          needs.macos.result == 'success' &&
          (needs.linux.result == 'success' || needs.linux.result == 'skipped')
        )
      )
    needs: [version, linux, macos]
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.candidate.outputs.digest || steps.reuse.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - id: reuse-source
        name: Read reused candidate source run
        if: ${{ inputs.candidate_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > candidate-source-run.json
      - uses: actions/download-artifact@v4
        if: ${{ inputs.candidate_run_id == '' }}
        with:
          name: macos-arm64
          path: incoming/macos-arm64
      - uses: actions/download-artifact@v4
        if: ${{ inputs.candidate_run_id == '' }}
        with:
          name: macos-staging-arm64
          path: incoming/macos-staging-arm64
      - uses: actions/download-artifact@v4
        if: ${{ inputs.candidate_run_id == '' && needs.version.outputs.release_surface == 'desktop-and-scaffold' }}
        with:
          pattern: linux-*
          path: incoming
      - name: Download exact prior release candidate
        if: ${{ inputs.candidate_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ needs.version.outputs.version }}
          path: reused
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
      - id: candidate
        name: Assemble immutable release candidate
        if: ${{ inputs.candidate_run_id == '' }}
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SOURCE_EPOCH: ${{ needs.version.outputs.source_epoch }}
          RELEASE_SURFACE: ${{ needs.version.outputs.release_surface }}
        run: |
          set -euo pipefail
          scaffold_runtime_version="$(cat scaffold-runtime-version.txt)"
          mkdir -p candidate
          find incoming -type f -name 'comet-*' -exec cp '{}' candidate/ \;
          jq -n --arg version "$VERSION" --arg sourceRevision "$GITHUB_SHA" \
            --arg runtimeContract "$scaffold_runtime_version" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{schemaVersion:1,version:$version,sourceRevision:$sourceRevision,runtimeContract:$runtimeContract,repository:$repository,workflowRun:$workflowRun,delivery:"authenticated-private-gcs"}' \
            > candidate/provenance.json

          for channel in desktop desktop-staging; do
            prefix=comet
            if [[ "$channel" == desktop-staging ]]; then prefix=comet-staging; fi
            desktop_files=(
              "$prefix-$VERSION-macos-arm64.dmg"
              "$prefix-$VERSION-macos-arm64-app.tar.gz"
            )
            for file in "${desktop_files[@]}"; do test -f "candidate/$file"; done
            (cd candidate && sha256sum "${desktop_files[@]}" > "$channel-SHA256SUMS")
            jq -n \
              --arg version "$VERSION" \
              --arg releaseSurface "$channel" \
              --arg commit "$GITHUB_SHA" \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --arg scaffoldRuntimeVersion "$scaffold_runtime_version" \
              --rawfile sums "candidate/$channel-SHA256SUMS" \
              '{schemaVersion:2,releaseSurface:$releaseSurface,scaffoldRuntimeVersion:$scaffoldRuntimeVersion,version:$version,source:{repository:$repository,commit:$commit,workflowRun:$run},files:($sums|split("\n")|map(select(length>0)|capture("^(?<sha256>[0-9a-f]{64})  (?<name>.+)$"))|map({key:.name,value:{sha256:.sha256}})|from_entries)}' \
              > "candidate/$channel-manifest.json"
          done

          if [[ "$RELEASE_SURFACE" == "desktop-and-scaffold" ]]; then
            scaffold_files=(
              "comet-$VERSION-linux-x86_64.tar.gz"
              "comet-$VERSION-linux-aarch64.tar.gz"
            )
            for file in "${scaffold_files[@]}"; do test -f "candidate/$file"; done
            cp install.sh candidate/install.sh
            (cd candidate && sha256sum "${scaffold_files[@]}" > scaffold-SHA256SUMS)
            cat incoming/linux-*/COMET_SHA256SUMS > candidate/COMET_SHA256SUMS
            jq -n \
              --arg version "$VERSION" \
              --arg commit "$GITHUB_SHA" \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --arg scaffoldRuntimeVersion "$scaffold_runtime_version" \
              --rawfile sums candidate/scaffold-SHA256SUMS \
              '{schemaVersion:2,releaseSurface:"scaffold",scaffoldRuntimeVersion:$scaffoldRuntimeVersion,version:$version,source:{repository:$repository,commit:$commit,workflowRun:$run},files:($sums|split("\n")|map(select(length>0)|capture("^(?<sha256>[0-9a-f]{64})  (?<name>.+)$"))|map({key:.name,value:{sha256:.sha256}})|from_entries)}' \
              > candidate/scaffold-manifest.json
            cat candidate/desktop-SHA256SUMS candidate/scaffold-SHA256SUMS > candidate/SHA256SUMS
            jq -n \
              --arg version "$VERSION" \
              --arg commit "$GITHUB_SHA" \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --rawfile sums candidate/SHA256SUMS \
              '{schemaVersion:1,version:$version,source:{repository:$repository,commit:$commit,workflowRun:$run},files:($sums|split("\n")|map(select(length>0)|capture("^(?<sha256>[0-9a-f]{64})  (?<name>.+)$"))|map({key:.name,value:{sha256:.sha256}})|from_entries)}' \
              > candidate/manifest.json
          fi

          tar --sort=name --mtime="@$SOURCE_EPOCH" --owner=0 --group=0 --numeric-owner \
            -czf release-candidate.tar.gz -C candidate .
          digest="$(sha256sum release-candidate.tar.gz | cut -d' ' -f1)"
          printf '%s  %s\n' "$digest" release-candidate.tar.gz > release-candidate.tar.gz.sha256
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - id: reuse
        name: Validate exact prior release candidate
        if: ${{ inputs.candidate_run_id != '' }}
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_SURFACE: ${{ needs.version.outputs.release_surface }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp reused/release-candidate.tar.gz reused/release-candidate.tar.gz.sha256 .
          sha256sum --check release-candidate.tar.gz.sha256
          mkdir candidate
          tar -xzf release-candidate.tar.gz -C candidate
          source_branch="$(jq -r '.head_branch // empty' candidate-source-run.json)"
          source_sha="$(jq -r '.head_sha // empty' candidate-source-run.json)"
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ || -z "$source_branch" ]]; then
            echo "::error::candidate source run returned an invalid branch or commit"
            exit 1
          fi
          source_commit_reachable=false
          if [[ "$source_branch" == "main" ]]; then
            source_commit_reachable=true
          else
            compare_status="$(
              gh api "repos/$GITHUB_REPOSITORY/compare/$source_sha...$GITHUB_SHA" --jq '.status'
            )"
            if [[ "$compare_status" == "ahead" || "$compare_status" == "identical" ]]; then
              source_commit_reachable=true
            else
              echo "::error::candidate commit $source_sha from $source_branch is not an ancestor of main $GITHUB_SHA"
              exit 1
            fi
          fi
          node scripts/validate-release-candidate-reuse.mjs \
            candidate-source-run.json \
            candidate \
            "$VERSION" \
            "$RELEASE_SURFACE" \
            "$GITHUB_REPOSITORY" \
            "$CANDIDATE_RUN_ID" \
            "$source_commit_reachable"
          (cd candidate && sha256sum --check desktop-SHA256SUMS)
          (cd candidate && sha256sum --check desktop-staging-SHA256SUMS)
          if [[ "$RELEASE_SURFACE" == "desktop-and-scaffold" ]]; then
            (cd candidate && sha256sum --check scaffold-SHA256SUMS)
            (cd candidate && sha256sum --check SHA256SUMS)
          fi
          digest="$(sha256sum release-candidate.tar.gz | cut -d' ' -f1)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ needs.version.outputs.version }}
          path: |
            release-candidate.tar.gz
            release-candidate.tar.gz.sha256
          if-no-files-found: error

  verify-macos-candidate:
    if: ${{ always() && needs.version.result == 'success' && needs.candidate.result == 'success' }}
    needs: [version, candidate]
    runs-on: macos-15
    env:
      COMET_MACOS_SIGNING_TEAM_ID: ${{ vars.MACOS_SIGNING_TEAM_ID }}
      VERSION: ${{ needs.version.outputs.version }}
      EXPECTED_DIGEST: ${{ needs.candidate.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ needs.version.outputs.version }}
      - *apple-ticket-transport
      - name: Verify exact candidate and signed macOS artifacts
        shell: bash
        run: |
          set -euo pipefail
          shasum -a 256 --check release-candidate.tar.gz.sha256
          actual="$(shasum -a 256 release-candidate.tar.gz | cut -d' ' -f1)"
          test "$actual" = "$EXPECTED_DIGEST"
          mkdir candidate
          tar -xzf release-candidate.tar.gz -C candidate
          bash scripts/verify-macos-release.sh candidate "$VERSION"

  publish-staging:
    if: >-
      always() &&
      needs.version.result == 'success' &&
      needs.candidate.result == 'success' &&
      needs['verify-macos-candidate'].result == 'success' &&
      (needs.version.outputs.promotion_target == 'staging-candidate' || needs.version.outputs.promotion_target == 'staging' || needs.version.outputs.promotion_target == 'production')
    needs: [version, candidate, verify-macos-candidate]
    runs-on: ubuntu-24.04
    environment: comet-release-staging
    outputs:
      promoted_digest: ${{ steps.verify.outputs.digest }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      COMET_RELEASES_GCS_BUCKET: ${{ secrets.COMET_RELEASES_GCS_BUCKET }}
      RELEASE_SURFACE: ${{ needs.version.outputs.release_surface }}
      PROMOTION_TARGET: ${{ needs.version.outputs.promotion_target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ needs.version.outputs.version }}
      - id: verify
        name: Verify candidate digest
        env:
          EXPECTED_DIGEST: ${{ needs.candidate.outputs.digest }}
        run: |
          sha256sum --check release-candidate.tar.gz.sha256
          actual="$(sha256sum release-candidate.tar.gz | cut -d' ' -f1)"
          test "$actual" = "$EXPECTED_DIGEST"
          echo "digest=$actual" >> "$GITHUB_OUTPUT"
          mkdir candidate && tar -xzf release-candidate.tar.gz -C candidate
      - id: auth
        name: Authenticate the staging publisher
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@v2
      - id: privacy
        name: Preflight exact storage permissions and privacy
        run: |
          set -euo pipefail
          required='["storage.buckets.get","storage.buckets.getIamPolicy","storage.objects.create","storage.objects.delete","storage.objects.get","storage.objects.list"]'
          access_token="$(gcloud auth print-access-token)"
          printf 'header = "Authorization: Bearer %s"\n' "$access_token" |
            curl --config - --fail-with-body --silent --show-error \
              "https://storage.googleapis.com/storage/v1/b/$COMET_RELEASES_GCS_BUCKET/iam/testPermissions?permissions=storage.buckets.get&permissions=storage.buckets.getIamPolicy&permissions=storage.objects.create&permissions=storage.objects.delete&permissions=storage.objects.get&permissions=storage.objects.list" \
              > permitted.json
          printf 'header = "Authorization: Bearer %s"\n' "$access_token" |
            curl --config - --fail-with-body --silent --show-error \
              "https://storage.googleapis.com/storage/v1/b/$COMET_RELEASES_GCS_BUCKET?fields=iamConfiguration" \
              > bucket-config.json
          unset access_token
          jq -e --argjson required "$required" \
            '($required - (.permissions // [])) as $missing | if ($missing | length) == 0 then true else error("missing publisher permissions: \($missing | join(", "))") end' \
            permitted.json
          jq -e '.iamConfiguration.uniformBucketLevelAccess.enabled == true and .iamConfiguration.publicAccessPrevention == "enforced"' bucket-config.json >/dev/null
          gcloud storage buckets get-iam-policy "gs://$COMET_RELEASES_GCS_BUCKET" --format=json > bucket-iam.json
          if jq -e '[.bindings[]?.members[]?] | any(. == "allUsers" or . == "allAuthenticatedUsers")' bucket-iam.json >/dev/null; then
            echo "::error::release bucket must not grant public or all-authenticated-user access"
            exit 1
          fi
      - id: publish
        name: Publish immutable staging release and selected moving channels
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SCAFFOLD_RUNTIME_DEPLOYMENT: ${{ inputs.scaffold_runtime_deployment || 'unchanged' }}
        run: |
          set -euo pipefail
          if [[ "${COMET_RELEASES_GCS_BUCKET:-}" != "ashler-comet-releases-staging" ]]; then
            echo "::error::staging release bucket configuration is invalid"
            exit 1
          fi
          publish_immutable() {
            source="$1"
            object="$2"
            existing="$(mktemp)"
            if gcloud storage cp "$object" "$existing" >/dev/null 2>&1; then
              if ! cmp -s "$source" "$existing"; then
                echo "::error::$object already exists with different bytes"
                return 1
              fi
              return 0
            fi
            if gcloud storage cp --if-generation-match=0 "$source" "$object"; then
              return 0
            fi
            gcloud storage cp "$object" "$existing" >/dev/null
            if ! cmp -s "$source" "$existing"; then
              echo "::error::$object won a publish race with different bytes"
              return 1
            fi
          }
          require_forward_version() {
            channel="$1"
            current="$(gcloud storage cat "gs://$COMET_RELEASES_GCS_BUCKET/releases/$channel-latest.txt" 2>/dev/null || true)"
            if [[ -n "$current" && "$current" != "$VERSION" ]] && ! dpkg --compare-versions "$VERSION" gt "$current"; then
              echo "::error::$channel latest release is $current; refusing to move backward to $VERSION"
              return 1
            fi
          }
          for file in candidate/*; do
            name="$(basename "$file")"
            publish_immutable "$file" "gs://$COMET_RELEASES_GCS_BUCKET/releases/$VERSION/$name"
          done
          if [[ "$PROMOTION_TARGET" == "staging-candidate" ]]; then
            echo "Published immutable private staging candidate $VERSION without moving release channels."
            exit 0
          fi
          current_scaffold_manifest="$RUNNER_TEMP/current-scaffold-manifest.json"
          if ! gcloud storage cp \
            "gs://$COMET_RELEASES_GCS_BUCKET/releases/scaffold-manifest.json" \
            "$current_scaffold_manifest" >/dev/null 2>&1; then
            rm -f "$current_scaffold_manifest"
          fi
          node scripts/guard-scaffold-runtime-release.mjs \
            candidate/desktop-manifest.json \
            "$current_scaffold_manifest" \
            staging \
            "$SCAFFOLD_RUNTIME_DEPLOYMENT" \
            "$RELEASE_SURFACE"
          for file in candidate/*; do
            name="$(basename "$file")"
            case "$name" in
              *manifest.json|*SHA256SUMS|provenance.json|install.sh) ;;
              *) publish_immutable "$file" "gs://$COMET_RELEASES_GCS_BUCKET/releases/$name" ;;
            esac
          done
          require_forward_version desktop
          require_forward_version desktop-staging
          if [[ "$RELEASE_SURFACE" == "desktop-and-scaffold" ]]; then
            require_forward_version scaffold
          fi
          for channel in desktop desktop-staging; do
            gcloud storage cp "candidate/$channel-manifest.json" "gs://$COMET_RELEASES_GCS_BUCKET/releases/$channel-manifest.json"
            gcloud storage cp "candidate/$channel-SHA256SUMS" "gs://$COMET_RELEASES_GCS_BUCKET/releases/$channel-SHA256SUMS"
            printf '%s' "$VERSION" > "$channel-latest.txt"
            gcloud storage cp "$channel-latest.txt" "gs://$COMET_RELEASES_GCS_BUCKET/releases/$channel-latest.txt"
          done

          if [[ "$RELEASE_SURFACE" == "desktop-and-scaffold" ]]; then
            gcloud storage cp candidate/scaffold-manifest.json "gs://$COMET_RELEASES_GCS_BUCKET/releases/scaffold-manifest.json"
            gcloud storage cp candidate/scaffold-SHA256SUMS "gs://$COMET_RELEASES_GCS_BUCKET/releases/scaffold-SHA256SUMS"
            gcloud storage cp candidate/install.sh "gs://$COMET_RELEASES_GCS_BUCKET/releases/install.sh"
            printf '%s' "$VERSION" > scaffold-latest.txt
            gcloud storage cp scaffold-latest.txt "gs://$COMET_RELEASES_GCS_BUCKET/releases/scaffold-latest.txt"

            # Preserve the unified channel for clients released before the split.
            gcloud storage cp candidate/manifest.json "gs://$COMET_RELEASES_GCS_BUCKET/releases/manifest.json"
            gcloud storage cp candidate/SHA256SUMS "gs://$COMET_RELEASES_GCS_BUCKET/releases/SHA256SUMS"
            gcloud storage cp scaffold-latest.txt "gs://$COMET_RELEASES_GCS_BUCKET/releases/latest.txt"
          fi
      - id: readback
        name: Verify published staging channels
        if: ${{ needs.version.outputs.promotion_target != 'staging-candidate' }}
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          readback="$(mktemp -d)"
          trap 'rm -rf "$readback"' EXIT

          verify_object() {
            source="$1"
            name="$2"
            gcloud storage cp \
              "gs://$COMET_RELEASES_GCS_BUCKET/releases/$name" \
              "$readback/$name" >/dev/null
            if ! cmp -s "$source" "$readback/$name"; then
              echo "::error::published staging release object $name differs from the promoted candidate"
              return 1
            fi
          }
          verify_pointer() {
            name="$1"
            actual="$(gcloud storage cat "gs://$COMET_RELEASES_GCS_BUCKET/releases/$name")"
            if [[ "$actual" != "$VERSION" ]]; then
              echo "::error::published staging release pointer $name is $actual, expected $VERSION"
              return 1
            fi
          }

          for channel in desktop desktop-staging; do
            verify_object "candidate/$channel-manifest.json" "$channel-manifest.json"
            verify_object "candidate/$channel-SHA256SUMS" "$channel-SHA256SUMS"
            verify_pointer "$channel-latest.txt"
          done
          if [[ "$RELEASE_SURFACE" == "desktop-and-scaffold" ]]; then
            verify_object candidate/scaffold-manifest.json scaffold-manifest.json
            verify_object candidate/scaffold-SHA256SUMS scaffold-SHA256SUMS
            verify_object candidate/manifest.json manifest.json
            verify_object candidate/SHA256SUMS SHA256SUMS
            verify_object candidate/install.sh install.sh
            verify_pointer scaffold-latest.txt
            verify_pointer latest.txt
          fi

  publish-production:
    if: >-
      always() &&
      needs.version.result == 'success' &&
      needs.candidate.result == 'success' &&
      needs['verify-macos-candidate'].result == 'success' &&
      needs['publish-staging'].result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      needs.version.outputs.promotion_target == 'production'
    needs: [version, candidate, verify-macos-candidate, publish-staging]
    runs-on: ubuntu-24.04
    environment: comet-release-production
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      COMET_RELEASES_GCS_BUCKET: ${{ secrets.COMET_RELEASES_GCS_BUCKET }}
      RELEASE_SURFACE: ${{ needs.version.outputs.release_surface }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ needs.version.outputs.version }}
      - name: Require byte-identical staging candidate
        env:
          BUILD_DIGEST: ${{ needs.candidate.outputs.digest }}
          STAGING_DIGEST: ${{ needs.publish-staging.outputs.promoted_digest }}
        run: |
          sha256sum --check release-candidate.tar.gz.sha256
          actual="$(sha256sum release-candidate.tar.gz | cut -d' ' -f1)"
          test "$actual" = "$BUILD_DIGEST"
          test "$actual" = "$STAGING_DIGEST"
          mkdir candidate && tar -xzf release-candidate.tar.gz -C candidate
      - id: auth
        name: Authenticate the production publisher
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@v2
      - id: privacy
        name: Preflight exact storage permissions and privacy
        run: |
          set -euo pipefail
          required='["storage.buckets.get","storage.buckets.getIamPolicy","storage.objects.create","storage.objects.delete","storage.objects.get","storage.objects.list"]'
          access_token="$(gcloud auth print-access-token)"
          printf 'header = "Authorization: Bearer %s"\n' "$access_token" |
            curl --config - --fail-with-body --silent --show-error \
              "https://storage.googleapis.com/storage/v1/b/$COMET_RELEASES_GCS_BUCKET/iam/testPermissions?permissions=storage.buckets.get&permissions=storage.buckets.getIamPolicy&permissions=storage.objects.create&permissions=storage.objects.delete&permissions=storage.objects.get&permissions=storage.objects.list" \
              > permitted.json
          printf 'header = "Authorization: Bearer %s"\n' "$access_token" |
            curl --config - --fail-with-body --silent --show-error \
              "https://storage.googleapis.com/storage/v1/b/$COMET_RELEASES_GCS_BUCKET?fields=iamConfiguration" \
              > bucket-config.json
          unset access_token
          jq -e --argjson required "$required" \
            '($required - (.permissions // [])) as $missing | if ($missing | length) == 0 then true else error("missing publisher permissions: \($missing | join(", "))") end' \
            permitted.json
          jq -e '.iamConfiguration.uniformBucketLevelAccess.enabled == true and .iamConfiguration.publicAccessPrevention == "enforced"' bucket-config.json >/dev/null
          gcloud storage buckets get-iam-policy "gs://$COMET_RELEASES_GCS_BUCKET" --format=json > bucket-iam.json
          if jq -e '[.bindings[]?.members[]?] | any(. == "allUsers" or . == "allAuthenticatedUsers")' bucket-iam.json >/dev/null; then
            echo "::error::release bucket must not grant public or all-authenticated-user access"
            exit 1
          fi
      - id: publish
        name: Promote immutable production release and selected moving channels
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SCAFFOLD_RUNTIME_DEPLOYMENT: ${{ inputs.scaffold_runtime_deployment || 'unchanged' }}
        run: |
          set -euo pipefail
          publish_immutable() {
            source="$1"
            object="$2"
            existing="$(mktemp)"
            if gcloud storage cp "$object" "$existing" >/dev/null 2>&1; then
              if ! cmp -s "$source" "$existing"; then
                echo "::error::$object already exists with different bytes"
                return 1
              fi
              return 0
            fi
            if gcloud storage cp --if-generation-match=0 "$source" "$object"; then
              return 0
            fi
            gcloud storage cp "$object" "$existing" >/dev/null
            if ! cmp -s "$source" "$existing"; then
              echo "::error::$object won a publish race with different bytes"
              return 1
            fi
          }
          require_forward_version() {
            channel="$1"
            current="$(gcloud storage cat "gs://$COMET_RELEASES_GCS_BUCKET/releases/$channel-latest.txt" 2>/dev/null || true)"
            if [[ -n "$current" && "$current" != "$VERSION" ]] && ! dpkg --compare-versions "$VERSION" gt "$current"; then
              echo "::error::$channel latest release is $current; refusing to move backward to $VERSION"
              return 1
            fi
          }
          current_scaffold_manifest="$RUNNER_TEMP/current-scaffold-manifest.json"
          if ! gcloud storage cp \
            "gs://$COMET_RELEASES_GCS_BUCKET/releases/scaffold-manifest.json" \
            "$current_scaffold_manifest" >/dev/null 2>&1; then
            rm -f "$current_scaffold_manifest"
          fi
          node scripts/guard-scaffold-runtime-release.mjs \
            candidate/desktop-manifest.json \
            "$current_scaffold_manifest" \
            production \
            "$SCAFFOLD_RUNTIME_DEPLOYMENT" \
            "$RELEASE_SURFACE"
          for file in candidate/*; do
            name="$(basename "$file")"
            case "$name" in comet-staging-*|desktop-staging-*) continue ;; esac
            publish_immutable "$file" "gs://$COMET_RELEASES_GCS_BUCKET/releases/$VERSION/$name"
            case "$name" in
              *manifest.json|*SHA256SUMS|provenance.json|install.sh) ;;
              *) publish_immutable "$file" "gs://$COMET_RELEASES_GCS_BUCKET/releases/$name" ;;
            esac
          done
          require_forward_version desktop
          gcloud storage cp candidate/desktop-manifest.json "gs://$COMET_RELEASES_GCS_BUCKET/releases/desktop-manifest.json"
          gcloud storage cp candidate/desktop-SHA256SUMS "gs://$COMET_RELEASES_GCS_BUCKET/releases/desktop-SHA256SUMS"
          printf '%s' "$VERSION" > desktop-latest.txt
          gcloud storage cp desktop-latest.txt "gs://$COMET_RELEASES_GCS_BUCKET/releases/desktop-latest.txt"

          if [[ "$RELEASE_SURFACE" == "desktop-and-scaffold" ]]; then
            require_forward_version scaffold
            gcloud storage cp candidate/scaffold-manifest.json "gs://$COMET_RELEASES_GCS_BUCKET/releases/scaffold-manifest.json"
            gcloud storage cp candidate/scaffold-SHA256SUMS "gs://$COMET_RELEASES_GCS_BUCKET/releases/scaffold-SHA256SUMS"
            gcloud storage cp candidate/install.sh "gs://$COMET_RELEASES_GCS_BUCKET/releases/install.sh"
            printf '%s' "$VERSION" > scaffold-latest.txt
            gcloud storage cp scaffold-latest.txt "gs://$COMET_RELEASES_GCS_BUCKET/releases/scaffold-latest.txt"

            # Preserve the unified channel for clients released before the split.
            gcloud storage cp candidate/manifest.json "gs://$COMET_RELEASES_GCS_BUCKET/releases/manifest.json"
            gcloud storage cp candidate/SHA256SUMS "gs://$COMET_RELEASES_GCS_BUCKET/releases/SHA256SUMS"
            gcloud storage cp scaffold-latest.txt "gs://$COMET_RELEASES_GCS_BUCKET/releases/latest.txt"
          fi
      - name: Verify published production channels
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          readback="$(mktemp -d)"
          trap 'rm -rf "$readback"' EXIT

          verify_object() {
            source="$1"
            name="$2"
            gcloud storage cp \
              "gs://$COMET_RELEASES_GCS_BUCKET/releases/$name" \
              "$readback/$name" >/dev/null
            if ! cmp -s "$source" "$readback/$name"; then
              echo "::error::published production release object $name differs from the promoted candidate"
              return 1
            fi
          }

          verify_pointer() {
            name="$1"
            actual="$(gcloud storage cat "gs://$COMET_RELEASES_GCS_BUCKET/releases/$name")"
            if [[ "$actual" != "$VERSION" ]]; then
              echo "::error::published production release pointer $name is $actual, expected $VERSION"
              return 1
            fi
          }

          verify_object candidate/desktop-manifest.json desktop-manifest.json
          verify_object candidate/desktop-SHA256SUMS desktop-SHA256SUMS
          verify_pointer desktop-latest.txt

          if [[ "$RELEASE_SURFACE" == "desktop-and-scaffold" ]]; then
            verify_object candidate/scaffold-manifest.json scaffold-manifest.json
            verify_object candidate/scaffold-SHA256SUMS scaffold-SHA256SUMS
            verify_object candidate/manifest.json manifest.json
            verify_object candidate/SHA256SUMS SHA256SUMS
            verify_object candidate/install.sh install.sh
            verify_pointer scaffold-latest.txt
            verify_pointer latest.txt
          fi

          echo "Verified production release channels at $VERSION."
