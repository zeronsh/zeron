name: release

# Build release artifacts and publish them:
#   - Linux headless tarballs (x86_64 + aarch64) via scripts/package-linux.sh
#   - macOS dmg (Apple silicon) via scripts/package-macos.sh
#   - Windows per-user installer, portable zip, and updater exe (x86_64) via
#     scripts/package-windows.ps1
# then create a GitHub Release AND upload everything to the
# `comet-native-releases` R2 bucket (served at zeron.sh/releases/* for
# `curl -fsSL https://zeron.sh/install.sh | sh`), bumping latest.txt.
#
# Trigger: push a tag `v<version>` matching the workspace version in
# Cargo.toml (bump it in the same commit), or run manually via
# workflow_dispatch (builds + uploads artifacts, no release/R2 publish).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cursor-compatibility:
    uses: ./.github/workflows/cursor-compatibility.yml

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04 # x86_64
          - runner: ubuntu-24.04-arm # aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: gpui system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # A tag's cache is never restored by anything else and pushed main's out
          # of the repository's 10 GB (docs/reference/ci.md#caches).
          save-if: false
      - name: package
        run: scripts/package-linux.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-${{ runner.arch }}
          path: target/package/*.tar.gz
          if-no-files-found: error

  # Every platform must build before publishing the release and updater manifest.
  #
  # Signing/notarization (both optional — absent secrets fall back to an
  # ad-hoc-signed build):
  #   MACOS_CERT_P12 / MACOS_CERT_PASSWORD — base64 "Developer ID Application"
  #     certificate + private key (.p12) and its export password.
  #   AC_API_KEY_P8 / AC_API_KEY_ID / AC_API_ISSUER_ID — App Store Connect API
  #     key (raw .p8 contents), for notarytool. All three present → the package
  #     script notarizes and staples the app + dmg (no Gatekeeper warning).
  # They live in the `apple-release` environment, which only release tags and
  # main may use: a run from any other branch gets no environment, so no
  # credentials, and builds ad-hoc-signed.
  macos:
    runs-on: macos-latest # Apple silicon
    environment: ${{ (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && 'apple-release' || '' }}
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
      AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
      AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # A tag's cache is never restored by anything else and pushed main's out
          # of the repository's 10 GB (docs/reference/ci.md#caches).
          save-if: false
      - name: import Developer ID certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          pass="$(openssl rand -hex 16)"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 -d >"$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          # Allow codesign to use the imported key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          [ -n "$identity" ] || { echo "p12 contains no Developer ID Application identity"; exit 1; }
          echo "CODESIGN_IDENTITY=$identity" >>"$GITHUB_ENV"
      - name: notary credentials
        if: env.AC_API_KEY_P8 != ''
        run: |
          printf '%s' "$AC_API_KEY_P8" >"$RUNNER_TEMP/ac_api_key.p8"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/ac_api_key.p8"
            echo "NOTARY_KEY_ID=$AC_API_KEY_ID"
            echo "NOTARY_ISSUER_ID=$AC_API_ISSUER_ID"
          } >>"$GITHUB_ENV"
      - name: package dmg
        run: scripts/package-macos.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ runner.arch }}
          path: |
            target/package/*.dmg
            target/package/*.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Locate Windows SDK shader compiler
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/fxc.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'Windows SDK fxc.exe is required for GPUI release shaders' }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # A tag's cache is never restored by anything else and pushed main's out
          # of the repository's 10 GB (docs/reference/ci.md#caches).
          save-if: false
      - name: package installer and portable app
        run: ./scripts/package-windows.ps1 -ReleasesUrl "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-${{ runner.arch }}
          path: |
            target/package/*.zip
            target/package/*.exe
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [cursor-compatibility, linux, macos, windows]
    runs-on: ubuntu-latest
    environment: cloudflare
    env:
      # `secrets` is not a valid context in step `if:` expressions — surface
      # the token through job env and gate on that instead.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b57dde68ee5964dccc025437b5478a5b
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: version guard (tag == artifact version)
        run: |
          ver="${GITHUB_REF_NAME#v}"
          ls dist/
          for platform in linux-x86_64.tar.gz linux-aarch64.tar.gz \
              macos-arm64.dmg macos-arm64-app.tar.gz \
              windows-x86_64.zip windows-x86_64.exe windows-x86_64-setup.exe; do
            test -f "dist/zeron-$ver-$platform" \
              || { echo "missing artifact for tag v$ver: $platform — check builds and Cargo.toml version"; exit 1; }
          done
          echo "VERSION=$ver" >> "$GITHUB_ENV"
      - name: updater manifest
        run: |
          manifest=$(jq -n --arg version "$VERSION" '{version: $version, files: {}}')
          for f in dist/*; do
            sha=$(sha256sum "$f" | cut -d' ' -f1)
            manifest=$(jq --arg name "$(basename "$f")" --arg sha "$sha" \
              '.files[$name] = {sha256: $sha}' <<<"$manifest")
          done
          printf '%s' "$manifest" > manifest.json
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/*
            manifest.json
          generate_release_notes: true
          # Releases are immutable once published, so their files can't be
          # replaced. Keep the ones already there, so re-running this job
          # after a failed R2 upload gets past this step.
          overwrite_files: false
      - name: upload to R2 (zeron.sh/releases/*)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          # The Cloudflare API returns the odd 502; retry each object.
          put() {
            for attempt in 1 2 3 4 5; do
              npx wrangler@4 r2 object put "comet-native-releases/$1" --file "$2" --remote && return 0
              echo "upload of $1 failed (attempt $attempt), retrying" >&2
              sleep $((attempt * 10))
            done
            return 1
          }
          for f in dist/*; do
            put "$(basename "$f")" "$f"
          done
          # manifest.json: version + per-artifact sha256 — the auto-updater
          # (crates/update) verifies downloads against it. Published before
          # latest.txt so no client ever sees a version without its checksums.
          put manifest.json manifest.json
          printf '%s' "$VERSION" > latest.txt
          put latest.txt latest.txt
