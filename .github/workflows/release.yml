name: release

# Build release artifacts and publish them. The app is the zgx one
# (apps/zgx), built by zgx-build.yml as betas are:
#   - Linux tarballs (x86_64 + aarch64): the app, its engine, scripts
#   - macOS dmg and the updater's app tarball (Apple silicon, macOS 13+)
#   - Windows per-user installer, portable zip, and the standalone exe that
#     the old app's updater installs (it completes itself from the zip)
# then create a GitHub Release AND upload everything to the
# `comet-native-releases` R2 bucket (served at zeron.sh/releases/* for
# `curl -fsSL https://zeron.sh/install.sh | sh`), bumping latest.txt.
#
# Every shipped Zeron installs these (crates/update at v0.2.138 reads the same
# names, checksums and `--version` answers).
#
# Trigger: push a tag `v<version>` matching the workspace version in
# Cargo.toml (bump it in the same commit), or run manually via
# workflow_dispatch (builds + uploads artifacts, no release/R2 publish).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: Which to build.
        type: string
        default: macos linux windows

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: version (the workspace's; a tag's must be it)
        id: version
        run: |
          workspace="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "${GITHUB_REF_NAME#v}" != "$workspace" ]; then
            echo "tag $GITHUB_REF_NAME isn't the workspace's v$workspace"; exit 1
          fi
          echo "version=$workspace" >>"$GITHUB_OUTPUT"

  cursor-compatibility:
    uses: ./.github/workflows/cursor-compatibility.yml

  zgx:
    needs: version
    uses: ./.github/workflows/zgx-build.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}
      platforms: ${{ github.event_name == 'push' && 'macos linux windows' || inputs.platforms }}
      # The edge's, as the betas': stable at its root, the beta channel in its
      # `beta/`. (The old app's installs name the GitHub release marked
      # latest; their first package moves them here.)
      windows-feed: https://zeron.sh/releases

  publish:
    # Every platform must build before publishing the release and updater manifest.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [version, cursor-compatibility, zgx]
    runs-on: ubuntu-latest
    environment: cloudflare
    env:
      # `secrets` is not a valid context in step `if:` expressions — surface
      # the token through job env and gate on that instead.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b57dde68ee5964dccc025437b5478a5b
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: version guard (tag == artifact version)
        run: |
          ver="${GITHUB_REF_NAME#v}"
          ls dist/
          for platform in linux-x86_64.tar.gz linux-aarch64.tar.gz \
              macos-arm64.dmg macos-arm64-app.tar.gz \
              windows-x86_64.zip windows-x86_64.exe windows-x86_64-setup.exe; do
            test -f "dist/zeron-$ver-$platform" \
              || { echo "missing artifact for tag v$ver: $platform — check builds and Cargo.toml version"; exit 1; }
          done
          echo "VERSION=$ver" >> "$GITHUB_ENV"
      - name: updater manifest
        run: |
          # The app needs macOS 13 (Ghostty's floor). A Mac below it is held on
          # the release it has, and told why (crates/update `offer`, in every
          # Zeron since 0.2.136).
          manifest=$(jq -n --arg version "$VERSION" '{version: $version, minimumMacOS: "13.0", files: {}}')
          for f in dist/*; do
            sha=$(sha256sum "$f" | cut -d' ' -f1)
            manifest=$(jq --arg name "$(basename "$f")" --arg sha "$sha" \
              '.files[$name] = {sha256: $sha}' <<<"$manifest")
          done
          printf '%s' "$manifest" > manifest.json
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/*
            manifest.json
          generate_release_notes: true
          # Releases are immutable once published, so their files can't be
          # replaced. Keep the ones already there, so re-running this job
          # after a failed R2 upload gets past this step.
          overwrite_files: false
      - name: upload to R2 (zeron.sh/releases/*)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          # The Cloudflare API returns the odd 502; retry each object.
          put() {
            for attempt in 1 2 3 4 5; do
              npx wrangler@4 r2 object put "comet-native-releases/$1" --file "$2" --remote && return 0
              echo "upload of $1 failed (attempt $attempt), retrying" >&2
              sleep $((attempt * 10))
            done
            return 1
          }
          for f in dist/*; do
            put "$(basename "$f")" "$f"
          done
          # manifest.json: version + per-artifact sha256 — the auto-updater
          # (crates/update) verifies downloads against it. Published before
          # latest.txt so no client ever sees a version without its checksums.
          put manifest.json manifest.json
          # This release's own, beside its files: a Windows install finishing
          # itself takes its own version's package by it, whatever the latest
          # is by then (crates/update `windows::pinned_release`).
          put "manifest-$VERSION.json" manifest.json
          printf '%s' "$VERSION" > latest.txt
          put latest.txt latest.txt
          # The beta channel carries every release: a beta
          # download (the website's) gets each stable release too, unless a
          # newer beta is already there, and stays on beta (crates/update
          # `follows_channels`). The same files under beta/, the manifest last.
          # Read from the bucket itself, not a cache; on any doubt, leave it.
          beta=""
          if npx wrangler@4 r2 object get comet-native-releases/beta/manifest.json --file beta-current.json --remote; then
            beta="$(jq -r '.version // empty' beta-current.json)"
          fi
          if [ -z "$beta" ]; then
            # Loudly: claim-only betas reach stable through this copy alone.
            # Re-run the job once the bucket answers.
            echo "::error::couldn't read the beta channel's manifest, so this release isn't in the beta channel"
            exit 1
          elif python3 - "$VERSION" "$beta" <<'PY'
          import re, sys
          def key(v):
              m = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)(?:-beta\.(\d+))?", v.strip())
              if not m:
                  return None
              major, minor, patch, beta = m.groups()
              # A release outranks its betas.
              return (int(major), int(minor), int(patch), beta is None, int(beta or 0))
          new, old = key(sys.argv[1]), key(sys.argv[2])
          sys.exit(0 if new and (old is None or new > old) else 1)
          PY
          then
            for f in dist/*; do
              put "beta/$(basename "$f")" "$f"
            done
            put "beta/manifest-$VERSION.json" manifest.json
            put beta/manifest.json manifest.json
          else
            echo "the beta channel's $beta is newer than $VERSION: left as it is"
          fi
