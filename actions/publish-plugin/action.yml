name: Publish a Zeron plugin
description: Check a Zeron plugin or template against the store's rules and publish it (live at once, verified once Zeron has read it) with a deploy token.
author: Zeron
branding:
  icon: upload-cloud
  color: gray-dark

inputs:
  token:
    description: >-
      A deploy token (zdt_…), from your repository's secrets. Make one with
      `zeron plugin token create --name "GitHub Actions" --plugins <id>`, in
      Zeron, or on the store's site. Without it, the plugin (or template) is
      only checked (`zeron plugin check`, `zeron template check`).
    required: false
    default: ""
  path:
    description: The plugin's or template's folder (the one with zeron-plugin.json or zeron-template.json), relative to the workspace.
    required: false
    default: "."
  dry-run:
    description: "`true`: check and pack the plugin, but don't publish it. `true` or `false` only: anything else fails the step."
    required: false
    default: "false"
  zeron-version:
    description: >-
      The Zeron release whose command line runs: `latest` (follows each new
      release), or a version like 0.4.0 (refused if its manifest names
      another).
    required: false
    default: latest
  sha256:
    description: >-
      Optional: the sha256 of that release's Linux command line tarball for
      this runner. Given with a pinned zeron-version, the step runs exactly
      that command line or fails.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Publish
      shell: bash
      # Inputs reach the script as environment variables, never pasted into
      # it: a path or version can't become a command.
      env:
        ZERON_DEPLOY_TOKEN: ${{ inputs.token }}
        ZERON_PLUGIN_PATH: ${{ inputs.path }}
        ZERON_DRY_RUN: ${{ inputs.dry-run }}
        ZERON_VERSION: ${{ inputs.zeron-version }}
        ZERON_SHA256: ${{ inputs.sha256 }}
      run: '"$GITHUB_ACTION_PATH/publish.sh"'
