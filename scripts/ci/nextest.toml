# cargo-nextest settings for CI (pass with --config-file).
#
# Two tests are timing-sensitive and fail now and then when nextest runs many tests
# at once (the old `cargo test` runs were serial per binary, and the UI run was
# `--test-threads=1` in the release profile). nextest reports a pass-on-retry as
# FLAKY, so these stay visible in the log. Remove an override once its test is fixed.

# zeron-ui `state::tests::bootstrap_reports_local_assembly_failure_before_returning_a_handle`
# picks a "free" port (bind(:0) + drop), makes an engine bootstrap fail, then asserts
# nothing listens on that port ("failed bootstrap must release the IPC listener").
# In the dev profile it fails on the first attempt in roughly one run in three and
# passes on the retry, even when it runs alone: a race in listener teardown or port
# reuse.
[[profile.default.overrides]]
filter = 'package(zeron-ui) & test(bootstrap_reports_local_assembly_failure_before_returning_a_handle)'
retries = 2

# zeron-harness `opencode::mcp_injection_tests::mcp_injection_reaches_isolated_server_processes`
# starts `node` fixture scripts and `binary_version` gives each `--version` probe 2 s;
# on a loaded 4-core runner the probe occasionally times out ("cannot determine
# opencode version for MCP configuration").
[[profile.default.overrides]]
filter = 'package(zeron-harness) & test(mcp_injection_reaches_isolated_server_processes)'
retries = 2

# Windows used to run the zeron-ui library with `cargo test --test-threads=1`:
# every test in one process, where native platform state (fonts, DirectWrite,
# the message loop) is shared. nextest gives each test its own process, so they
# run side by side there too. If one turns out to share state across processes,
# put just it in a max-threads = 1 test group.

# preview `discovery` tests bind the fixed port 7331 and serialize with a mutex,
# which does nothing when every test is its own process (nextest): one at a time.
[test-groups.preview-discovery]
max-threads = 1

[[profile.default.overrides]]
filter = 'binary_id(zeron-preview::discovery)'
test-group = 'preview-discovery'

# `ci`: pull requests and main (NEXTEST_PROFILE=ci). Leaves out slow and soak
# tests, which the scheduled runs (default profile) still run:
#   engine doc_host sync at 48-chat scale and against the real 30 s quantum /
#     10 s idle grace (the ~16 small sync_lifecycle tests cover the policy);
#   harness codex: an app server that keeps dying (sleeps the real 1+3+8 s backoff);
#   preview `leak` (RSS growth under churn) and the two discovery tests that
#     assert nothing happens during a 5-7 s sleep.
# The cursor_shim stress test runs 14 rounds instead of 100 (ZERON_STRESS_ROUNDS).
[profile.ci]
default-filter = '''
not (
  (package(zeron-engine) & (
    test(=doc_host::sync_lifecycle_tests::cold_jobs_get_a_real_timed_turn_without_any_writer_ending)
    | test(=doc_host::sync_lifecycle_tests::slow_checkpoints_survive_idle_grace_with_all_slots_occupied)
    | test(/^doc_host::sync_lifecycle_tests::forty_eight_/)))
  | (binary_id(zeron-harness::codex) & test(=an_app_server_that_keeps_dying_reports_what_it_printed))
  | binary_id(zeron-preview::leak)
  | (binary_id(zeron-preview::discovery) & (test(=a_discovered_server_is_probed_once_not_every_cycle)
      | test(=authentication_callbacks_receive_no_discovery_connections)))
)
'''
