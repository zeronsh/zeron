# Terminals on other devices, for every viewer (the desktop engine and the
# phone alike): the direct peer-to-peer link's protocol, and the hub that
# carries a terminal's I/O over the direct link when the devices can reach
# each other and the relay when they can't — switching mid-session with no
# gap, no repeat and no lost keystroke.
