[package]
name = "zeron-vt"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The terminal emulator core shared by the desktop terminal panel (crates/ui)
# and the mobile terminal (crates/mobile): `alacritty_terminal`'s `Term` + vte
# as a pure bytes-in / grid-out state machine, plus key → PTY byte encoding.
# No I/O and no UI toolkit.

[dependencies]
alacritty_terminal.workspace = true
