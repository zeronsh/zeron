[package]
name = "zeron-voice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
cpal = "=0.17.3"
rubato = "=0.16.2"
reqwest.workspace = true
tokio.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true

# transcribe.cpp, built from source (CMake, a C++ compiler): Metal on macOS,
# the CPU elsewhere. (Vulkan would make the app need libvulkan / vulkan-1.dll
# to start at all.)
[target.'cfg(target_os = "macos")'.dependencies]
transcribe-cpp = { version = "=0.4.2", default-features = false, features = ["metal"] }
[target.'cfg(not(target_os = "macos"))'.dependencies]
transcribe-cpp = { version = "=0.4.2", default-features = false }

[dev-dependencies]
hound = "3.5"
tempfile.workspace = true
