[package]
name = "zeron-voice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
parakeet-rs = "=0.3.8"
# Keep the nested ZGX workspace on the same native runtime as ZUI.
ort = "=2.0.0-rc.13"
ort-sys = "=2.0.0-rc.13"
rubato = "=0.16.2"
reqwest.workspace = true
tokio.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true

# Not on Linux: CPAL links ALSA's libasound, which the loader would then need
# before `zeron` (also what servers and Cloud machines run) could start at
# all. Linux records through ALSA loaded when first used (src/alsa.rs).
[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "=0.17.3"

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"
libc = "0.2"

[dev-dependencies]
hound = "3.5"
tempfile.workspace = true
