[package]
name = "zeron-mcp-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "zeron_mcp_proxy"

[[bin]]
name = "zeron-mcp-proxy"
path = "src/main.rs"

[[bin]]
name = "fake-mcp"
path = "tests/support/fake_mcp.rs"
test = false
bench = false

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "io-util", "io-std", "process", "time", "fs", "signal", "sync"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex = "0.4"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
tempfile.workspace = true
