[package]
name = "zeron-codex-mobile"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

# Isolated from the desktop dependency graph. build-codex.sh prepares the
# pinned upstream checkout plus the iOS direct-tools patch before Cargo resolves these paths.
[workspace]

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
codex-app-server-client = { path = "../../target/native-agent-spike/codex/codex-rs/app-server-client" }
codex-app-server-protocol = { path = "../../target/native-agent-spike/codex/codex-rs/app-server-protocol" }
codex-arg0 = { path = "../../target/native-agent-spike/codex/codex-rs/arg0" }
codex-config = { path = "../../target/native-agent-spike/codex/codex-rs/config" }
codex-core = { path = "../../target/native-agent-spike/codex/codex-rs/core" }
codex-feedback = { path = "../../target/native-agent-spike/codex/codex-rs/feedback" }
codex-protocol = { path = "../../target/native-agent-spike/codex/codex-rs/protocol" }
git2 = { version = "0.20", default-features = false, features = ["https", "vendored-libgit2", "vendored-openssl"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
toml = "0.9"

[profile.dev]
debug = 0

[profile.release]
opt-level = "s"
debug = 0

[patch.crates-io]
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "efa177859fd9623d57b9fe7ae9bf491ae1ac6ec4" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
